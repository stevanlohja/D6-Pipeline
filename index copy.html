<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40k Master Attack Pipeline</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --primary: #f59e0b;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --crit: #10b981;
            --hit: #3b82f6;
            --devastating: #a855f7;
            --section-border: #27272a;
            --danger: #dc2626;
            --success: #16a34a;
            --average-color: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .storage-bar {
            background: #222227;
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .storage-bar input { flex: 1; min-width: 150px; }
        .storage-bar select { flex: 1; min-width: 150px; }
        
        .btn-store {
            background: var(--success);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .weapon-card {
            background: #222227;
            border: 1px solid var(--section-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .weapon-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #3f3f46;
        }

        .weapon-title-input {
            background: transparent;
            border: none;
            color: var(--primary);
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            width: 70%;
        }

        .btn-delete-weapon {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .phase-container {
            background: #1a1a1e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #3f3f46;
        }
        .phase-container.hit-phase { border-left-color: var(--hit); }
        .phase-container.wound-phase { border-left-color: var(--devastating); }

        .phase-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .form-group { margin-bottom: 10px; }

        .grid-5 {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 1fr 1fr;
            gap: 6px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            background: #27272a;
            border: 1px solid #3f3f46;
            color: var(--text);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--primary); }

        .checkbox-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .checkbox-label input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: var(--primary);
        }

        .conditional-selector-box {
            background: #27272a;
            padding: 8px;
            border-radius: 6px;
            margin-top: 8px;
            border: 1px dashed #3f3f46;
        }

        .btn-add-weapon {
            width: 100%;
            background: #27272a;
            border: 1px dashed var(--primary);
            color: var(--primary);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-roll {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-roll:hover { background: #d97706; }

        .btn-average {
            background: var(--average-color);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-average:hover { background: #0891b2; }

        .results-container {
            margin-top: 24px;
            border-top: 2px dashed #3f3f46;
            padding-top: 24px;
            display: none;
        }

        .allocation-card {
            background: #222227;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .allocation-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--primary);
            border-bottom: 1px solid #3f3f46;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .conversion-badge {
            background: #2d2d34;
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            border: 1px solid #3f3f46;
        }

        .allocation-pool-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .log-container {
            background: #141416;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #adbac7;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #2d2d32;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Tactical Damage Pipeline</h1>

    <div class="storage-bar">
        <input type="text" id="rosterNameInput" placeholder="e.g., Space Marine Squad">
        <button class="btn-store" onclick="saveCurrentRoster()">Save Roster</button>
        <select id="savedRostersSelect" onchange="loadSelectedRoster()">
            <option value="" disabled selected>-- Load Saved Roster --</option>
        </select>
    </div>

    <div id="weaponsContainer"></div>

    <button class="btn-add-weapon" onclick="addWeaponCard()">
        + Add Weapon Profile
    </button>

    <div class="action-button-group">
        <button class="btn-roll" onclick="executeMasterPipeline(1)">Resolve Single Salvo</button>
        <button class="btn-average" onclick="executeMasterPipeline(5)">Simulate 5-Round Game</button>
    </div>

    <div class="results-container" id="resultsContainer">
        <label id="allocationLabel" style="font-size: 0.85rem; margin-bottom: 10px; display: block; text-transform: uppercase; color: var(--primary);">
            Defending Player Allocation Blocks
        </label>
        
        <div id="allocationBlocksContainer"></div>

        <label style="margin-top: 15px; display: block;">Combat Diagnostics Log</label>
        <div class="log-container" id="combatLog"></div>
    </div>
</div>

<script>
    let weaponCounter = 0;

    window.onload = function() {
        updateRosterDropdown();
        addWeaponCard(null, 10, 3, 4, 0, 1);
    };

    function addWeaponCard(name = null, attacks = 6, hitTarget = 3, woundTarget = 4, ap = 0, damage = 1, modifiers = {}) {
        weaponCounter++;
        const finalName = name ? name : `Weapon ${weaponCounter}`;
        const container = document.getElementById('weaponsContainer');
        
        const hasCustomCritHit = modifiers.hasCustomCritHit || false;
        const critHitVal = modifiers.critHit || 5;
        const hasAnti = modifiers.hasAnti || false;
        const critWoundVal = modifiers.critWound || 4;
        const hitMod = modifiers.hitModifier || 0;
        const woundMod = modifiers.woundModifier || 0;

        const cardHtml = `
            <div class="weapon-card" id="weaponCard_${weaponCounter}">
                <div class="weapon-card-header">
                    <input type="text" class="weapon-title-input" value="${finalName}">
                    <button class="btn-delete-weapon" onclick="this.closest('.weapon-card').remove()">Remove</button>
                </div>
                
                <div class="form-group grid-5">
                    <div>
                        <label>Attacks</label>
                        <input type="number" class="w-attacks" value="${attacks}" min="1">
                    </div>
                    <div>
                        <label>Hit (BS/WS)</label>
                        <select class="w-hitTarget">
                            ${[2,3,4,5,6].map(v => `<option value="${v}" ${v===hitTarget?'selected':''}>${v}+</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label>Wound</label>
                        <select class="w-woundTarget">
                            ${[2,3,4,5,6].map(v => `<option value="${v}" ${v===woundTarget?'selected':''}>${v}+</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label>AP</label>
                        <select class="w-ap">
                            ${[0,-1,-2,-3,-4].map(v => `<option value="${v}" ${v===ap?'selected':''}>${v}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label>Damage (D)</label>
                        <input type="number" class="w-damage" value="${damage}" min="1">
                    </div>
                </div>

                <div class="phase-container hit-phase">
                    <div class="phase-title">Hit Modifiers</div>
                    <div class="grid-2" style="margin-bottom: 8px;">
                        <div class="form-group">
                            <label>Hit Re-rolls</label>
                            <select class="w-hitReRoll">
                                <option value="none" ${modifiers.hitReRoll==='none'?'selected':''}>None</option>
                                <option value="ones" ${modifiers.hitReRoll==='ones'?'selected':''}>Re-roll 1s</option>
                                <option value="full" ${modifiers.hitReRoll==='full'?'selected':''}>Full</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Hit Roll Modifier</label>
                            <select class="w-hitModifier">
                                <option value="0" ${hitMod===0?'selected':''}>None</option>
                                <option value="1" ${hitMod===1?'selected':''}>+1 to Hit</option>
                                <option value="-1" ${hitMod===-1?'selected':''}>-1 to Hit</option>
                            </select>
                        </div>
                    </div>
                    <div class="checkbox-row">
                        <label class="checkbox-label"><input type="checkbox" class="w-torrent" ${modifiers.torrent?'checked':''}> [TORRENT]</label>
                        <label class="checkbox-label"><input type="checkbox" class="w-lethal" ${modifiers.lethal?'checked':''}> [LETHAL HITS]</label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="w-toggleCritHit" onchange="document.getElementById('critHitDiv_${weaponCounter}').style.display = this.checked ? 'block' : 'none'" ${hasCustomCritHit?'checked':''}> [CUSTOM CRIT HIT]
                        </label>
                        <div style="display:flex; align-items:center; gap:4px; margin-left:auto;">
                            <span style="font-size:0.75rem; color:var(--text-muted);">[SUSTAINED]</span>
                            <select class="w-sustained" style="width:45px; padding:2px;">
                                <option value="0" ${modifiers.sustained===0?'selected':''}>0</option>
                                <option value="1" ${modifiers.sustained===1?'selected':''}>1</option>
                                <option value="2" ${modifiers.sustained===2?'selected':''}>2</option>
                            </select>
                        </div>
                    </div>

                    <div class="conditional-selector-box" id="critHitDiv_${weaponCounter}" style="display: ${hasCustomCritHit ? 'block' : 'none'};">
                        <label>Critical Hit Threshold (Sustained/Lethals score on:)</label>
                        <select class="w-critHitThreshold">
                            <option value="5" ${critHitVal===5?'selected':''}>5+</option>
                            <option value="4" ${critHitVal===4?'selected':''}>4+</option>
                            <option value="3" ${critHitVal===3?'selected':''}>3+</option>
                        </select>
                    </div>
                </div>

                <div class="phase-container wound-phase">
                    <div class="phase-title">Wound Modifiers</div>
                    <div class="grid-2" style="margin-bottom: 8px;">
                        <div class="form-group">
                            <label>Wound Re-rolls</label>
                            <select class="w-woundReRoll">
                                <option value="none" ${modifiers.woundReRoll==='none'?'selected':''}>None</option>
                                <option value="ones" ${modifiers.woundReRoll==='ones'?'selected':''}>Re-roll 1s</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Wound Roll Modifier</label>
                            <select class="w-woundModifier">
                                <option value="0" ${woundMod===0?'selected':''}>None</option>
                                <option value="1" ${woundMod===1?'selected':''}>+1 to Wound</option>
                                <option value="-1" ${woundMod===-1?'selected':''}>-1 to Wound</option>
                            </select>
                        </div>
                    </div>
                    <div class="checkbox-row">
                        <label class="checkbox-label"><input type="checkbox" class="w-twinLinked" ${modifiers.twinLinked?'checked':''}> [TWIN-LINKED]</label>
                        <label class="checkbox-label"><input type="checkbox" class="w-devastating" ${modifiers.devastating?'checked':''}> [DEVASTATING WOUNDS]</label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="w-toggleAnti" onchange="document.getElementById('antiDiv_${weaponCounter}').style.display = this.checked ? 'block' : 'none'" ${hasAnti?'checked':''}> [ANTI-] KEYWORD
                        </label>
                    </div>

                    <div class="conditional-selector-box" id="antiDiv_${weaponCounter}" style="display: ${hasAnti ? 'block' : 'none'};">
                        <label>Critical Wound Rule Target Value:</label>
                        <select class="w-critWoundThreshold">
                            <option value="2" ${critWoundVal===2?'selected':''}>2+</option>
                            <option value="3" ${critWoundVal===3?'selected':''}>3+</option>
                            <option value="4" ${critWoundVal===4?'selected':''}>4+</option>
                            <option value="5" ${critWoundVal===5?'selected':''}>5+</option>
                        </select>
                    </div>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
    }

    // --- LOCAL STORAGE PERSISTENCE ---
    function saveCurrentRoster() {
        const rosterName = document.getElementById('rosterNameInput').value.trim();
        if (!rosterName) return alert("Please enter a name for your Roster before saving.");

        const cards = document.querySelectorAll('.weapon-card');
        if (cards.length === 0) return alert("Add at least one weapon profile to save.");

        const rosterData = [];
        cards.forEach(card => {
            rosterData.push({
                name: card.querySelector('.weapon-title-input').value,
                attacks: parseInt(card.querySelector('.w-attacks').value),
                hitTarget: parseInt(card.querySelector('.w-hitTarget').value),
                woundTarget: parseInt(card.querySelector('.w-woundTarget').value),
                ap: parseInt(card.querySelector('.w-ap').value),
                damage: parseInt(card.querySelector('.w-damage').value),
                modifiers: {
                    hitReRoll: card.querySelector('.w-hitReRoll').value,
                    hitModifier: parseInt(card.querySelector('.w-hitModifier').value),
                    hasCustomCritHit: card.querySelector('.w-toggleCritHit').checked,
                    critHit: parseInt(card.querySelector('.w-critHitThreshold').value),
                    torrent: card.querySelector('.w-torrent').checked,
                    lethal: card.querySelector('.w-lethal').checked,
                    sustained: parseInt(card.querySelector('.w-sustained').value),
                    woundReRoll: card.querySelector('.w-woundReRoll').value,
                    woundModifier: parseInt(card.querySelector('.w-woundModifier').value),
                    hasAnti: card.querySelector('.w-toggleAnti').checked,
                    critWound: parseInt(card.querySelector('.w-critWoundThreshold').value),
                    twinLinked: card.querySelector('.w-twinLinked').checked,
                    devastating: card.querySelector('.w-devastating').checked
                }
            });
        });

        let library = JSON.parse(localStorage.getItem('wh40k_rosters')) || {};
        library[rosterName] = rosterData;
        localStorage.setItem('wh40k_rosters', JSON.stringify(library));

        alert(`Successfully saved "${rosterName}" to browser memory.`);
        updateRosterDropdown();
        document.getElementById('savedRostersSelect').value = rosterName;
    }

    function updateRosterDropdown() {
        const select = document.getElementById('savedRostersSelect');
        select.innerHTML = '<option value="" disabled selected>-- Load Saved Roster --</option>';
        let library = JSON.parse(localStorage.getItem('wh40k_rosters')) || {};
        Object.keys(library).forEach(name => {
            const opt = document.createElement('option');
            opt.value = name; opt.textContent = name;
            select.appendChild(opt);
        });
    }

    function loadSelectedRoster() {
        const rosterName = document.getElementById('savedRostersSelect').value;
        let library = JSON.parse(localStorage.getItem('wh40k_rosters')) || {};
        if (!library[rosterName]) return;

        document.getElementById('weaponsContainer').innerHTML = '';
        weaponCounter = 0;

        library[rosterName].forEach(w => {
            addWeaponCard(w.name, w.attacks, w.hitTarget, w.woundTarget, w.ap, w.damage, w.modifiers);
        });
        document.getElementById('rosterNameInput').value = rosterName;
    }

    // --- PIPELINE ENGINE CALCULATOR ---
    function rollD6() { return Math.floor(Math.random() * 6) + 1; }

    function executeMasterPipeline(rounds = 1) {
        const cards = document.querySelectorAll('.weapon-card');
        if (cards.length === 0) return alert("Please build a weapon profile first.");

        let log = [];
        if (rounds === 5) {
            log.push(`=== COMMENCING 5-ROUND MATCH SIMULATION ===`);
            document.getElementById('allocationLabel').innerText = "Defending Player Allocation Blocks (5-Round Track)";
        } else {
            log.push(`=== COMMENCING SIMULATED ATTACK SEQUENCING ===`);
            document.getElementById('allocationLabel').innerText = "Defending Player Allocation Blocks (Single Salvo)";
        }

        let aggregatedResults = {};

        cards.forEach((card, index) => {
            const name = card.querySelector('.weapon-title-input').value || "Agnostic Weapon";
            const attacks = parseInt(card.querySelector('.w-attacks').value) || 0;
            if (attacks <= 0) return;

            const ap = parseInt(card.querySelector('.w-ap').value);
            const damage = parseInt(card.querySelector('.w-damage').value);

            const isTorrent = card.querySelector('.w-torrent').checked;
            const hitTarget = parseInt(card.querySelector('.w-hitTarget').value);
            const hitReRoll = card.querySelector('.w-hitReRoll').value;
            const hitModifier = parseInt(card.querySelector('.w-hitModifier').value);
            const hasCustomCritHit = card.querySelector('.w-toggleCritHit').checked;
            const critHitThreshold = hasCustomCritHit ? parseInt(card.querySelector('.w-critHitThreshold').value) : 6;
            const hasLethal = card.querySelector('.w-lethal').checked;
            const sustainedValue = parseInt(card.querySelector('.w-sustained').value);

            const woundTarget = parseInt(card.querySelector('.w-woundTarget').value);
            const woundReRoll = card.querySelector('.w-woundReRoll').value;
            const woundModifier = parseInt(card.querySelector('.w-woundModifier').value);
            const isTwinLinked = card.querySelector('.w-twinLinked').checked;
            const hasAnti = card.querySelector('.w-toggleAnti').checked;
            const critWoundThreshold = hasAnti ? parseInt(card.querySelector('.w-critWoundThreshold').value) : 6;
            const hasDevastating = card.querySelector('.w-devastating').checked;

            let weaponTotals = { normal: 0, lethal: 0, devastating: 0 };

            for (let r = 1; r <= rounds; r++) {
                let hitSuccesses = 0;
                let lethalAutoWounds = 0;
                let sustainedBonusHits = 0;

                if (isTorrent) {
                    hitSuccesses = attacks;
                } else {
                    for (let i = 0; i < attacks; i++) {
                        let roll = rollD6();
                        if ((hitReRoll === 'ones' && roll === 1) || (hitReRoll === 'full' && roll < hitTarget)) {
                            roll = rollD6();
                        }
                        if (roll === 1) continue;

                        if (roll === 6 || roll >= critHitThreshold) {
                            if (hasLethal) lethalAutoWounds++;
                            else hitSuccesses++;
                            if (sustainedValue > 0) sustainedBonusHits += sustainedValue;
                        } else {
                            let modifiedRoll = roll + hitModifier;
                            if (modifiedRoll >= hitTarget) hitSuccesses++;
                        }
                    }
                }

                let activeWoundRollingPool = hitSuccesses + sustainedBonusHits;

                for (let i = 0; i < activeWoundRollingPool; i++) {
                    let roll = rollD6();
                    if (isTwinLinked && roll < woundTarget) {
                        roll = rollD6();
                    } else if (woundReRoll === 'ones' && roll === 1) {
                        roll = rollD6();
                    }
                    if (roll === 1) continue;

                    if (roll === 6 || roll >= critWoundThreshold) {
                        if (hasDevastating) weaponTotals.devastating++;
                        else weaponTotals.normal++;
                    } else {
                        let modifiedRoll = roll + woundModifier;
                        if (modifiedRoll >= woundTarget) weaponTotals.normal++;
                    }
                }
                weaponTotals.lethal += lethalAutoWounds;
            }

            let runningSumTotalSaves = weaponTotals.normal + weaponTotals.lethal + weaponTotals.devastating;
            let avgSavesPerRound = runningSumTotalSaves / rounds;
            let conversionPercentage = (((avgSavesPerRound) / attacks) * 100).toFixed(1);

            aggregatedResults[index] = {
                name: name, ap: ap, damage: damage, attacks: attacks,
                totalNormal: weaponTotals.normal,
                totalLethal: weaponTotals.lethal,
                totalDevastating: weaponTotals.devastating,
                avgNormal: weaponTotals.normal / rounds,
                avgLethal: weaponTotals.lethal / rounds,
                avgDevastating: weaponTotals.devastating / rounds,
                conversionRate: conversionPercentage,
                combinedGrandTotal: runningSumTotalSaves
            };

            log.push(`&nbsp;&nbsp;&gt; <strong>${name}</strong>: Generated ${runningSumTotalSaves} total threats over ${rounds} rounds (Avg: ${avgSavesPerRound.toFixed(1)}/rd at ${conversionPercentage}% conversion).`);
        });

        // --- RENDER PANELS ---
        const blocksContainer = document.getElementById('allocationBlocksContainer');
        blocksContainer.innerHTML = '';

        Object.keys(aggregatedResults).forEach(key => {
            let b = aggregatedResults[key];
            if (b.combinedGrandTotal === 0) return;

            // Combine Standard + Lethal wounds since they require the exact same saving throws
            let totalSavesAvg = b.avgNormal + b.avgLethal;
            let totalSavesSum = b.totalNormal + b.totalLethal;

            let html = `
                <div class="allocation-card">
                    <div class="allocation-header">
                        <span>${b.name} <span class="conversion-badge">Through: ${b.conversionRate}%</span></span>
                        <span>AP: ${b.ap} | Damage: ${b.damage}</span>
                    </div>
            `;
            
            if (rounds === 5) {
                // Main consolidated block total
                if (totalSavesAvg > 0) {
                    html += `<div class="allocation-pool-row" style="border-bottom: 1px dashed #3f3f46; padding-bottom: 4px; margin-bottom: 6px; font-weight: bold; color: var(--primary);"><span>Total Saves Required (Armor/Invul):</span> <span><strong>${totalSavesAvg.toFixed(1)}</strong> / rd (${totalSavesSum} total)</span></div>`;
                }
                // Visual sub-pool breakdowns for verification
                if (b.avgNormal > 0) html += `<div class="allocation-pool-row" style="font-size: 0.8rem; padding-left: 8px; color: var(--text-muted);"><span>&bull; From Normal Wounds:</span> <span>${b.avgNormal.toFixed(1)} / rd</span></div>`;
                if (b.avgLethal > 0) html += `<div class="allocation-pool-row" style="font-size: 0.8rem; padding-left: 8px; color: var(--crit)"><span>&bull; From Lethal Hits (Auto-Wound):</span> <span>${b.avgLethal.toFixed(1)} / rd</span></div>`;
                
                if (b.avgDevastating > 0) {
                    let totalDmg = b.totalDevastating * b.damage;
                    html += `<div class="allocation-pool-row" style="color:#e9d5ff; margin-top: 6px; border-top: 1px dashed #3f3f46; padding-top: 6px;"><span>Devastating Wounds (No Saves Allowed!):</span> <span><strong>${b.avgDevastating.toFixed(1)}</strong> / rd (${totalDmg} Tot. Dmg)</span></div>`;
                }
            } else {
                if (totalSavesSum > 0) {
                    html += `<div class="allocation-pool-row" style="border-bottom: 1px dashed #3f3f46; padding-bottom: 4px; margin-bottom: 6px; font-weight: bold; color: var(--primary);"><span>Total Saves Required (Armor/Invul):</span> <strong>${totalSavesSum}</strong></div>`;
                }
                if (b.totalNormal > 0) html += `<div class="allocation-pool-row" style="font-size: 0.8rem; padding-left: 8px; color: var(--text-muted);"><span>&bull; From Normal Wounds:</span> <strong>${b.totalNormal}</strong></div>`;
                if (b.totalLethal > 0) html += `<div class="allocation-pool-row" style="font-size: 0.8rem; padding-left: 8px; color: var(--crit)"><span>&bull; From Lethal Hits (Auto-Wound):</span> <strong>${b.totalLethal}</strong></div>`;
                
                if (b.totalDevastating > 0) {
                    html += `<div class="allocation-pool-row" style="color:#e9d5ff; margin-top: 6px; border-top: 1px dashed #3f3f46; padding-top: 6px;"><span>Devastating Wounds (No Saves Allowed!):</span> <strong style="color:var(--devastating)">${b.totalDevastating} (${b.totalDevastating * b.damage} Tot. Dmg)</strong></div>`;
                }
            }
            
            html += `</div>`;
            blocksContainer.insertAdjacentHTML('beforeend', html);
        });

        if (blocksContainer.innerHTML === '') {
            blocksContainer.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.9rem; padding:20px;">All active attacks failed to clear pipeline thresholds across simulations.</div>`;
        }

        log.push(`=== CALCULATIONS COMPLETE ===`);
        document.getElementById('combatLog').innerHTML = log.join('<br>');
        document.getElementById('resultsContainer').style.display = 'block';
    }
</script>
</body>
</html>
