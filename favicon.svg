<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="D6 Pipeline">
  <!-- Subtle rounding for the browser-tab favicon. iOS/Android home-screen
       icons are rendered from icon-180.png / icon-512.png (full-bleed), so
       this rounding only affects the tab favicon, not bookmark icons. -->
  <rect width="64" height="64" rx="10" fill="#09090b"/>
  <rect x="10" y="10" width="44" height="44" rx="6" fill="#fbbf24"/>
  <g fill="#09090b">
    <circle cx="20" cy="20" r="3.5"/>
    <circle cx="20" cy="32" r="3.5"/>
    <circle cx="20" cy="44" r="3.5"/>
    <circle cx="44" cy="20" r="3.5"/>
    <circle cx="44" cy="32" r="3.5"/>
    <circle cx="44" cy="44" r="3.5"/>
  </g>
</svg>
